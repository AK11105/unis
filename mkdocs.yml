site_name: Masters Research — Europe 2027
site_description: A curated research portfolio for AI/ML Master's programmes in Europe
site_author: Atharva Kulkarni
site_url: https://ak11105.github.io/unis/

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social: []
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true

plugins:
  - search
  - tags

nav:
  - Shortlist: index.md
  - Universities:
    - universities/index.md
    - Primary:
      - Saarland: universities/saarland.md
      - RWTH Aachen: universities/rwth-aachen.md
      - TU Darmstadt: universities/tu-darmstadt.md
      - KIT: universities/kit.md
      - Tubingen: universities/tuebingen.md
      - IP Paris: universities/ip-paris.md
      - ETH Zurich: universities/eth-zurich.md
      - KTH: universities/kth.md
    - Secondary:
      - Paris-Saclay: universities/paris-saclay.md
      - EPFL: universities/epfl.md
  - Documents: documents.md
